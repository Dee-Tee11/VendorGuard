services:
  - type: web
    name: VendorGuard
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL # Neon, ligação direta (sem pooler)
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BASE_URL # sandbox; https://api-m.paypal.com for live
        value: https://api-m.sandbox.paypal.com
      - key: GROQ_API_KEY # required: the app does not start without it
        sync: false
      - key: DEMO_MODE # true: the live demo at /demo (sandbox only)
        value: "false"
      - key: DEMO_BUYER_EMAIL # the shared US sandbox buyer; required with DEMO_MODE
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
      - key: OPERATOR_TOKEN # optional: the demo's operator section; at least 32 characters
        sync: false
